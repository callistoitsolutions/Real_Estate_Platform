<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    $("#Assign_Enquiry").addClass("active");

    // Function to check upload file type

    function checkSelectedFileSize(_this) {
        var ext_arr = ['xlsx'];
        var f = _this.files[0];
        var sizeInMb = f.size / 1024;
        var sizeLimit = 1024 * 2;
        var filename = f.name;
        var ext = (/[.]/.exec(filename)) ? /[^.]+$/.exec(filename) : undefined;

        if (!ext_arr.includes(ext[0])) {
            alert("Please Upload only .xlsx file");
            _this.value = '';
            return false;
        }
    }

    // Sidebar Toggle for Desktop and Mobile
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const windowWidth = window.innerWidth;

        if (windowWidth <= 768) {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        } else {
            sidebar.classList.toggle('collapsed');
        }
    }

    // Close Sidebar (Mobile)
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Submenu Toggle - FIXED VERSION FOR MOBILE
    function toggleSubmenu(event, element) {
        event.preventDefault();
        event.stopPropagation();

        const submenu = element.nextElementSibling;
        const allSubmenus = document.querySelectorAll('.submenu');
        const allDropdownLinks = document.querySelectorAll('.menu-link');

        allSubmenus.forEach(sub => {
            if (sub !== submenu) {
                sub.classList.remove('active');
            }
        });

        allDropdownLinks.forEach(link => {
            if (link !== element) {
                link.classList.remove('dropdown-open');
            }
        });

        submenu.classList.toggle('active');
        element.classList.toggle('dropdown-open');

        return false;
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Close sidebar on window resize
    window.addEventListener('resize', function () {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const windowWidth = window.innerWidth;

        if (windowWidth > 768) {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    });

    // Handle clicks on submenu links and regular menu links
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.submenu-link').forEach(link => {
            link.addEventListener('click', function (e) {
                if (window.innerWidth <= 768) {
                    setTimeout(() => {
                        closeSidebar();
                    }, 200);
                }
            });
        });

        document.querySelectorAll('.menu-link').forEach(link => {
            if (!link.hasAttribute('onclick')) {
                link.addEventListener('click', function (e) {
                    if (window.innerWidth <= 768) {
                        setTimeout(() => {
                            closeSidebar();
                        }, 200);
                    }
                });
            }
        });
    });

    // Prevent body scroll when sidebar is open on mobile
    document.getElementById('sidebar').addEventListener('transitionend', function () {
        if (this.classList.contains('active')) {
            document.body.style.overflow = 'hidden';
        }
    });
</script>


{% comment %} Ajax Jquery and Javascript for delete property enquiries {% endcomment %}

<script>


    function Delete_Enquiry(enquiry_id)
    {
        swal({
            title: "DELETE",
            text: "Are you sure, you want to delete the property enquiry detail ?",
            icon: "warning",
            buttons: ["No", "Yes"],	
            closeOnClickOutside: false,
            dangerMode: true,
        })
        .then((willUpdate) => {
            if (willUpdate) 
            {	
                $.ajax({
                    type:"POST",
                    url: "{% url 'delete_property_enquiry' %}",
                    data: {'enquiry_id' : enquiry_id},
                    success: function (response) 
                    {
                        if (response.status == '1'){
                            swal(""+response.msg+"", { 
                                icon: "success",
                                button: "Ok",
                                closeOnClickOutside: false,
                            }).then((addcat)=>{
                                location.reload();
                            });
                        }
                        else{
                            swal(""+response.msg+"", {
                            icon: "info",
                            button: "Ok",
                            closeOnClickOutside: false,
                            });
                        }
                    }
                    
                })
            }
        });
    }
</script>

<script>

    // Ajax and Jquery to generate property enquiry reports

    function generate_property_enquiry_reports(){
        var start_date = $("#start_date").val();
        var end_date = $("#end_date").val();  
        var lead_source = $("#lead_source").val();  
        var lead_status = $("#lead_status").val();  

        if(start_date==''){
          alert('Please Select Start Date');
        }
        else if(end_date==''){
          alert('Please Select End Date');
        }
        else{
            $.ajax({
                method: "POST",
                url: "{% url 'date_property_filter_user' %}",
                data: {
                    'start_date':start_date,
                    'end_date':end_date,
                    'lead_source':lead_source,
                    'lead_status':lead_status,
                    'role':'{{user_obj.user_role}}',
                    'user_id':'{{user_obj.id}}'
                },
                 success : function(response){
                  $("#loading").hide();
                  console.log(response)
                  if (response == "error"){
                      swal({
                          title:"Sorry, the  search did not have any property enquiry Information ",
                          icon: "warning",
                          button: "Ok",
                          closeOnClickOutside: false,
                          })
                      }
                  else{
                      $('#property_enquiry_div').html("")
                      $('#property_enquiry_div').html(response)  
                      }			  
                  }
            });
        }
    }
</script>
