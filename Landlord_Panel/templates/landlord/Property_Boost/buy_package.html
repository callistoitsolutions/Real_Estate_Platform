{% include "landlord/landlord_header.html" %}
{% load static %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

  /* --- Original Layout & Sidebar Styles --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); overflow-x: hidden; min-height: 100vh; }
  .main-content { margin-left: var(--sidebar-width); margin-top: var(--topbar-height); padding: 30px; transition: all 0.3s ease; }
  .form-container { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); }
  .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
  
  /* --- Keeping Your Exact Back Button CSS --- */
  .btn-back {
    background: #f8f9fa;
    color: #2d3748;
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .btn-back:hover {
    background: var(--dark-gradient);
    color: white;
    transform: translateY(-2px);
  }

  /* --- Multi-step Horizontal Tracker --- */
  .step-progress-bar { display: flex; justify-content: space-between; align-items: center; margin: 0 auto 40px; position: relative; max-width: 600px; }
  .step-progress-bar::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 3px; background: #e9ecef; transform: translateY(-50%); z-index: 1; }
  .step-indicator { position: relative; z-index: 2; width: 45px; height: 45px; background: white; border: 3px solid #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #adb5bd; transition: all 0.3s ease; }
  .step-indicator.active { border-color: #10b981; color: #10b981; transform: scale(1.1); box-shadow: 0 0 15px rgba(102, 126, 234, 0.2); }
  .step-indicator.completed { background: #10b981; border-color: #10b981; color: white; }
  
  /* --- Form Step Animation --- */
  .form-step { display: none; }
  .form-step.active { display: block; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Section & Control Styling --- */
  .section-header { background: var(--primary-gradient); color: white; padding: 15px 20px; border-radius: 12px 12px 0 0; font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
  .section-body { background: #f8f9fa; padding: 25px; border-radius: 0 0 12px 12px; border: 2px solid #e9ecef; border-top: none; }
  .form-label { font-weight: 600; color: #2d3748; margin-bottom: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
  .form-control { border: 2px solid #e9ecef; border-radius: 12px; padding: 12px 15px; font-size: 0.95rem; transition: all 0.3s ease; width: 100%; }

  .form-footer { margin-top: 30px; padding-top: 25px; border-top: 2px solid #f0f0f0; display: flex; gap: 15px; justify-content: flex-end; }
  .btn-submit, .btn-next { background: var(--primary-gradient); color: white; padding: 12px 35px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
  .btn-prev { background: #f8f9fa; color: #2d3748; padding: 12px 35px; border-radius: 12px; border: 2px solid #e9ecef; font-weight: 600; cursor: pointer; }

  .form-title { font-size: 1.5rem; font-weight: 700; color: #2d3748; display: flex; align-items: center; gap: 12px; }

</style>

<div class="main-content">
  <div class="form-container" >
    <div class="form-header" >
      <div class="form-title" ><i class="fas fa-edit" ></i> Buy Subscription Plan</div>
      <button class="btn-back" onclick="history.back();"><i class="fas fa-arrow-left"></i> Back to List</button>
    </div>

    <div class="step-progress-bar">
      <div class="step-indicator active" id="ind-1">1</div>
      <div class="step-indicator" id="ind-2">2</div>
      <div class="step-indicator" id="ind-3">3</div>
    </div>

    <form method="POST" enctype="multipart/form-data" id="multistep-update-form">
      {% csrf_token %}

      <div class="form-step active" id="step-1">
        <div class="form-section">
          <div class="section-header"><i class="fas fa-user-tie"></i> Step 1: Landlord Details</div>
          <div class="section-body">
            <div class="row">
              <div class="col-md-4 mt-2">
                <label class="form-label">Id <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="user_id" name="user_id" required value="{{user_obj.user_id}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Name <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="user_name" name="user_name" required value="{{user_obj.user_name}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Email Address <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="user_email" name="user_name" required value="{{user_obj.user_email}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Phone Number <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="user_phone" name="user_phone" maxlength="10" required value="{{user_obj.user_phone}}" disabled>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-step" id="step-2">
        <div class="form-section">
          <div class="section-header"><i class="fas fa-map-marked-alt"></i> Step 2: Package Details</div>
          <div class="section-body">
            <div class="row">
              <div class="col-md-4 mt-2">
                <label class="form-label">Package Name <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="package_name" name="package_name" required value="{{subscription.package_name}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Plan Name <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="plan_type" name="plan_type" required value="{{subscription.plan_type}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Plan Duration <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="plan_duration" name="plan_duration" required value="{{subscription.plan_duration}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Plan Price <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="plan_price" name="plan_price" required value="{{subscription.plan_offer_price}}" disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Plan Listings <span style="color:red;">*</span></label>
                <input type="text" class="form-control" id="plan_listings" name="plan_listings" required value="{{subscription.plan_max_listings}}" disabled>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-step" id="step-3">
        <div class="form-section">
          <div class="section-header"><i class="fas fa-shield-alt"></i> Step 3: Payment Information</div>
          <div class="section-body">
            <div class="row">
              <div class="col-md-4 mt-2">   
                <label class="form-label">Start Date <span style="color:red;">*</span></label>
                <input type="date" class="form-control" id="start_date" name="start_date" required disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">End Date <span style="color:red;">*</span></label>
                <input type="date" class="form-control" id="end_date" name="end_date" required disabled>
              </div>
              <div class="col-md-4 mt-2">
                <label class="form-label">Upload Payment Screenshot <span style="color:red;">*</span></label>
                <input type="file" class="form-control" id="payment_ss" name="payment_ss" required>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-prev" id="prevBtn" onclick="changeStep(-1)" style="display:none;">Previous</button>
        <button type="button" class="btn-next" id="nextBtn" onclick="changeStep(1)">Next Step <i class="fas fa-arrow-right"></i></button>
        <button type="button" class="btn-submit" id="submitBtn" onclick="Buy_Package(this)" style="display:none;"><i class="fas fa-save"></i> Buy Package</button>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert/dist/sweetalert.min.js"></script>

<script>

  $("#Landlord_Dashboard").addClass("active");

  document.addEventListener("DOMContentLoaded", function() {
    let today = new Date();
    
    // Format today as YYYY-MM-DD for the date input
    let yyyy = today.getFullYear();
    let mm = String(today.getMonth() + 1).padStart(2, '0');
    let dd = String(today.getDate()).padStart(2, '0');
    let formattedToday = `${yyyy}-${mm}-${dd}`;
    
    let startDateInput = document.getElementById('start_date');
    let endDateInput = document.getElementById('end_date');
    
    if (startDateInput) {
      startDateInput.value = formattedToday;
    }
    
    // Parse plan duration string (e.g., "3-months", "6-months", etc.)
    let durationText = "{{ subscription.plan_duration|default:'' }}".toLowerCase();
    let monthsToAdd = parseInt(durationText) || 1; 
    
    // Calculate end date by properly adding months
    let endDate = new Date(today.getFullYear(), today.getMonth() + monthsToAdd, today.getDate());
    
    let endYear = endDate.getFullYear();
    let endMonth = String(endDate.getMonth() + 1).padStart(2, '0');
    let endDay = String(endDate.getDate()).padStart(2, '0');
    let formattedEndDate = `${endYear}-${endMonth}-${endDay}`;
    
    if (endDateInput) {
      endDateInput.value = formattedEndDate;
    }
  });

  // Sidebar Toggle for Desktop and Mobile
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const windowWidth = window.innerWidth;

    if (windowWidth <= 768) {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
      document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    } else {
      sidebar.classList.toggle('collapsed');
    }
  }

  // Close Sidebar (Mobile)
  function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.remove('active');
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  // Submenu Toggle - FIXED VERSION FOR MOBILE
  function toggleSubmenu(event, element) {
    event.preventDefault();
    event.stopPropagation();

    const submenu = element.nextElementSibling;
    const allSubmenus = document.querySelectorAll('.submenu');
    const allDropdownLinks = document.querySelectorAll('.menu-link');

    allSubmenus.forEach(sub => {
      if (sub !== submenu) {
        sub.classList.remove('active');
      }
    });

    allDropdownLinks.forEach(link => {
      if (link !== element) {
        link.classList.remove('dropdown-open');
      }
    });

    submenu.classList.toggle('active');
    element.classList.toggle('dropdown-open');

    return false;
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // Close sidebar on window resize
  window.addEventListener('resize', function () {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const windowWidth = window.innerWidth;

    if (windowWidth > 768) {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
  });

  // Handle clicks on submenu links and regular menu links
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.submenu-link').forEach(link => {
      link.addEventListener('click', function (e) {
        if (window.innerWidth <= 768) {
          setTimeout(() => {
            closeSidebar();
          }, 200);
        }
      });
    });

    document.querySelectorAll('.menu-link').forEach(link => {
      if (!link.hasAttribute('onclick')) {
        link.addEventListener('click', function (e) {
          if (window.innerWidth <= 768) {
            setTimeout(() => {
              closeSidebar();
            }, 200);
          }
        });
      }
    });
  });

  // Prevent body scroll when sidebar is open on mobile
  document.getElementById('sidebar').addEventListener('transitionend', function () {
    if (this.classList.contains('active')) {
      document.body.style.overflow = 'hidden';
    }
  });

  let currentStep = 1;

  function showStep(step) {
    $(".form-step").removeClass("active");
    $(`#step-${step}`).addClass("active");

    $(".step-indicator").removeClass("active completed");
    for (let i = 1; i <= 3; i++) {
        if (i < step) $(`#ind-${i}`).addClass("completed");
        if (i === step) $(`#ind-${i}`).addClass("active");
    }

    $("#prevBtn").toggle(step > 1);
    $("#nextBtn").toggle(step < 3);
    $("#submitBtn").toggle(step === 3);
    window.scrollTo(0, 0);
  }

  function changeStep(n) {
    if (n === 1 && !validateCurrentStep()) return false;
    currentStep += n;
    showStep(currentStep);
  }

  function validateCurrentStep() {
    let valid = true;
    $(`#step-${currentStep} [required]`).each(function() {
        if ($(this).val() === "") {
            $(this).css("border-color", "#e74c3c");
            valid = false;
        } else {
            $(this).css("border-color", "#e9ecef");
        }
    });
    if (!valid) swal("Wait!", "Please fill all required fields.", "warning");
    return valid;
  }

  // AJAX Logic for Subscription Purchase/Update

  function Buy_Package(_this) {
    var startDate = $("#start_date").val();
    var endDate = $("#end_date").val();
    var paymentSs = $("#payment_ss")[0].files;

    if (paymentSs.length === 0) {
      swal("Error", "Please upload the payment screenshot", "error");
      return;
    }

    var fd = new FormData();
    fd.append('id', '');
    fd.append('fk_user', '{{user_obj.user_id}}');
    fd.append('fk_subscription', '{{subscription.id}}');
    fd.append('plan_start_date', startDate);
    fd.append('plan_end_date', endDate);
    fd.append('payment_ss', paymentSs[0]);

    $(_this).prop("disabled", true).html(`<span class="spinner-border spinner-border-sm"></span> Processing...`);

    $.ajax({
      method: "POST",
      url: "{% url 'Buy_Subscription_Ajax' %}",
      data: fd,
      processData: false,
      contentType: false,
      success: function (response) {
        $(_this).prop("disabled", false).html(`<i class="fas fa-save"></i> Buy Package`);
        if (response.status == '1') {
          swal("Success!", response.msg, "success").then(() => {
            window.location.href = "{% url 'landlord_dashboard' %}";
          });
        } else {
          swal("Error", response.msg, "error");
        }
      }
    });
  }
</script>
