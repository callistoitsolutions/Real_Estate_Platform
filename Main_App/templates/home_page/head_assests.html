{% load static %}

{% if header_settings and header_settings.logo_favicon %}
    <!-- Dynamic Favicon from Database/Settings -->
    <link rel="icon" type="image/x-icon" href="{{ header_settings.logo_favicon.url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ header_settings.logo_favicon.url }}">
{% else %}
    <!-- Fallback Static Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon.ico' %}?v=11">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/img/favicon.ico' %}?v=11">
{% endif %}
