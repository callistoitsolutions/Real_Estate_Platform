<!DOCTYPE html>
<html lang="en">

{% load static %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | KANISHKAIMPERIA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js" integrity="sha512-AA1Bzp5Q0K1KanKKmvN/4d3IRKVlv9PYgwFPvm32nPO6QS8yH1HO7LbgB1pgiOxPtfeg5zEn2ba64MUcqJx6CA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    :root {
      --ph-navy: #16233a;
      --ph-navy-2: #1f2f47;
      --ph-navy-3: #0b1730;
      --ph-gold: #c9a227;
      --ph-gold-light: #f1d888;
      --ph-pr2: #a5811c;
      --ph-border: #e4e6ee;
      --ph-text-body: #4b5568;
      --bg-main: #f7f7f5;
      --text-dark: #16233a;
      --shadow: 0 20px 50px rgba(11, 23, 48, 0.14);
    }

    /* BODY */
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, rgba(201,162,39,0.08), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(22,35,58,0.06), transparent 40%),
        var(--bg-main);
      font-family: "DM Sans", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--ph-text-body);
      overflow-x: hidden;
    }

    /* BRAND LOGO WRAPPER */
    .brand-header-wrap {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-circle-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ph-navy), var(--ph-navy-3));
      border: 2px solid var(--ph-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(11, 23, 48, 0.15);
    }
    .brand-circle-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--ph-navy);
      text-decoration: none;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }
    .brand-logo span {
      display: block;
      font-size: 1.4rem;
      color: var(--ph-pr2);
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 2px;
    }
    .brand-tagline {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ph-gold);
      margin-top: 2px;
    }

    /* LOGIN CARD */
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      border-radius: 20px;
      border: 1px solid var(--ph-border);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--ph-navy), var(--ph-gold), var(--ph-navy));
    }

    .form-title {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      text-align: center;
      font-size: 1.35rem;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--ph-text-body);
      margin-bottom: 28px;
    }

    /* INPUT STYLES */
    .form-control, .form-select {
      border: 1.5px solid var(--ph-border);
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 0.95rem;
      color: var(--text-dark);
      font-family: "DM Sans", sans-serif;
      box-shadow: none !important;
      transition: all 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--ph-gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15) !important;
    }

    .form-floating label {
      color: var(--ph-text-body);
      font-size: 0.9rem;
      padding-left: 15px;
    }
    .form-label-top {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
      display: block;
    }
    .required {
      color: #ef4444;
      margin-left: 2px;
    }

    /* LOGIN BUTTON */
    .btn-login {
      width: 100%;
      font-weight: 800;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--ph-navy), var(--ph-navy-3));
      border: none;
      padding: 14px;
      border-radius: 12px;
      color: #ffffff;
      transition: 0.2s;
      margin-top: 10px;
      font-family: "DM Sans", sans-serif;
      letter-spacing: .3px;
    }
    .btn-login:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(11, 23, 48, 0.3);
      color: #ffffff;
    }
    .btn-login:disabled {
      background: #cbd5e1;
      transform: none;
      box-shadow: none;
    }

    /* Gold accent button (used for OTP verify) */
    .btn-login.btn-gold {
      background: linear-gradient(135deg, var(--ph-gold), var(--ph-pr2));
      color: var(--ph-navy);
    }
    .btn-login.btn-gold:hover {
      color: var(--ph-navy);
      box-shadow: 0 10px 24px rgba(201, 162, 39, 0.35);
    }

    /* Success/complete accent button */
    .btn-login.btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .btn-login.btn-emerald:hover {
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.3);
    }

    /* LINKS */
    .bottom-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .bottom-link a {
      color: var(--ph-pr2);
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s;
    }
    .bottom-link a:hover {
      color: var(--ph-navy);
      text-decoration: underline;
    }

    /* PROGRESSIVE FLOW UTILS */
    .auth-step { display: none; }

    .auth-step.active-step { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .back-btn { background: none; border: none; color: var(--ph-text-body); font-size: 0.85rem; font-weight: 600; padding: 0; margin-bottom: 15px; transition: 0.2s; }
    .back-btn:hover { color: var(--ph-pr2); }

    .otp-container { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
    .otp-input { width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700; border-radius: 12px; border: 1.5px solid var(--ph-border); color: var(--text-dark); background: white; }

    .otp-input:focus { border-color: var(--ph-gold); outline: none; box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15); }

    /* OTP TIMER & RESEND */
    .otp-timer-box {
      text-align: center;
      font-size: 0.85rem;
      color: var(--ph-text-body);
      margin-bottom: 15px;
    }
    .resend-link {
      color: var(--ph-pr2);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .resend-link:hover {
      text-decoration: underline;
    }
    .resend-link.disabled {
      color: #cbd5e1;
      cursor: not-allowed;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand-header-wrap">
      <div class="brand-circle-logo">
        <img src="{% static 'login_logo.png' %}" alt="KanishkaImperia Logo" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'bi bi-building-fill\'></i>';">
      </div>
      <div class="brand-logo">
        KANISHKA <span>IMPERIA</span>
      </div>
      <div class="brand-tagline">Luxury Realty &amp; Estates</div>
    </div>

    <div class="form-title">Reset Password</div>

    <form method="post" onsubmit="return false;">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'' }}">

      <!-- STEP 1: IDENTIFIER INPUT -->
      <div id="step-1-email" class="auth-step active-step">
        <label class="form-label-top"><span id="identifierLabelText">Email Address</span> <span class="required">*</span></label>
        <div class="form-floating mb-3">
          <input type="email" id="forgot_email" class="form-control" placeholder="name@example.com" required>
          <label id="floatingLabelText">Email Address</label>
        </div>

        <!-- Channel Selection Options -->
        <label class="form-label-top">Send OTP Via <span class="required">*</span></label>
        <div class="d-flex gap-4 mb-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="otp_channel" id="channel_email" value="email" checked onchange="switchInputType()">
            <label class="form-check-label fw-medium text-dark" for="channel_email">Email</label>
          </div>
        </div>

        <button type="button" class="btn-login" onclick="checkEmailExists(this)">Continue</button>
        
      </div>

      <!-- STEP 2: OTP VERIFICATION -->
      <div id="step-2-otp" class="auth-step">
        <button type="button" class="back-btn" onclick="goToStepAuth('step-1-email')"><i class="bi bi-arrow-left"></i> Change Identifier</button>
        <div class="form-subtitle text-start mb-2">We've sent a 4-digit verification code to <strong id="display_otp_email" class="text-dark"></strong>.</div>
        
        <div class="otp-container">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
        </div>

        <div class="otp-timer-box">
          <span id="timerText">Resend OTP in <strong id="countdown">40</strong>s</span>
          <a id="resendBtn" class="resend-link disabled" onclick="resendOTPAction()">Resend OTP</a>
        </div>

        <button type="button" class="btn-login btn-gold" onclick="verifyOTP(this)">Verify OTP</button>
      </div>

      <!-- STEP 3: RESET PASSWORD -->
      <div id="step-3-details" class="auth-step">
        <div class="form-subtitle text-start text-success fw-bold mb-3"><i class="bi bi-check-circle-fill"></i> Verified! Update your password.</div>
        
        <label class="form-label-top">Password <span class="required">*</span></label>
        <div class="form-floating mb-3">
          <input type="password" id="forgot_pass" class="form-control" placeholder="Enter Password">
          <label>Password</label>
        </div>

        <label class="form-label-top">Confirm Password <span class="required">*</span></label>
        <div class="form-floating mb-3">
          <input type="password" id="forgot_com_pass" class="form-control" placeholder="Enter Confirm Password">
          <label>Confirm Password</label>
        </div>

        <button type="button" class="btn-login btn-emerald" onclick="processProgRegistration(this)">Update Password</button>

      </div>

      <div class="bottom-link">
        Remember Password? <a href="{% url 'login' %}">Return to Login</a>
      </div>
    </form>

  </div>

<script>
    let otpTimerInterval = null;

    // Tab switching engine
    function goToStepAuth(stepId) {
        $('.auth-step').removeClass('active-step');$('#' + stepId).addClass('active-step');
    }

    // Auto-tab assistant for verification boxes
    function moveToNext(current, event) {
        if (current.value.length >= current.maxLength) {
            let next = $(current).next('.otp-input');
            if (next.length) next.focus();
        }
        if (event.key === "Backspace" && current.value.length === 0) {
            let prev = $(current).prev('.otp-input');
            if (prev.length) prev.focus();
        }
    }

    // Switch input field type, placeholder, and label dynamically based on selected channel
    function switchInputType() {
        let channel = $('input[name="otp_channel"]:checked').val();
        let $input =$('#forgot_email');
        
        $input.val(''); 

        if (channel === 'email') {
            $input.attr('type', 'email').attr('placeholder', 'name@example.com').removeAttr('maxlength');
            $('#identifierLabelText').text('Email Address');
            $('#floatingLabelText').text('Email Address');
        } else {
            $input.attr('type', 'tel').attr('placeholder', '10-digit mobile number').attr('maxlength', '10');
            let channelName = channel === 'whatsapp' ? 'WhatsApp' : 'Mobile';
            $('#identifierLabelText').text(`${channelName} Number`);
            $('#floatingLabelText').text(`${channelName} Number`);
        }
    }

    // STEP 1: Verify Profile Existence & Format Check (Email or Mobile)
    function checkEmailExists(_this) {
        let rawVal = $('#forgot_email').val();
        let identifier = rawVal.trim();
        let selectedChannel = $('input[name="otp_channel"]:checked').val();
        
        if (!identifier) {
            return swal({icon: "warning", title: "Missing Input", text: `Please enter your ${selectedChannel === 'email' ? 'email address' : 'mobile number'}.`});
        }

        if (selectedChannel === 'email') {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (rawVal.includes(' ') || !emailRegex.test(identifier)) {
                return swal({icon: "warning", title: "Invalid Format", text: "Please enter a valid email address without spaces."});
            }
        } else {
            const phoneRegex = /^[0-9]{10}$/;
            if (!phoneRegex.test(identifier)) {
                return swal({icon: "warning", title: "Invalid Format", text: "Please enter a valid 10-digit mobile number."});
            }
        }

        let btnText = _this.innerHTML;
        _this.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Checking...`;
        $(_this).prop("disabled", true);

        $.ajax({
            type: "POST",
            url: "{% url 'Check_Email_Api' %}", 
            data: { 'email': identifier, 'channel': selectedChannel, 'csrfmiddlewaretoken': '{{ csrf_token }}' },
            success: function(response) {
                $(_this).prop("disabled", false).html(btnText);
                if(response.exists) {
                  sendOTP(identifier, selectedChannel); 
                } else {
                    swal({icon: "error", title: "Not Found", text: "This identifier is not registered in our records."});
                }
            },
            error: function() {
                $(_this).prop("disabled", false).html(btnText);
                swal({icon: "error", title: "Server Error", text: "Could not access profile records."});
            }
        });
    }

    // STEP 2B (Trigger): Request Verification Token & Start 40s Timer
    function sendOTP(identifier, channel) {
        $('#display_otp_email').text(identifier + ` (via ${channel.toUpperCase()})`);
        $('.otp-input').val(''); 
        goToStepAuth('step-2-otp');
        startOtpCountdown();

        $.ajax({
            type: "POST",
            url: "{% url 'Send_Otp_Forgot_Api' %}",
            data: { 'email': identifier, 'channel': channel, 'csrfmiddlewaretoken': '{{ csrf_token }}' }
        });
    }

    // 40 Seconds Countdown Logic
    function startOtpCountdown() {
        let timeLeft = 40;
        $('#countdown').text(timeLeft);
        $('#timerText').show();
        $('#resendBtn').addClass('disabled').removeAttr('onclick');

        if (otpTimerInterval) clearInterval(otpTimerInterval);

        otpTimerInterval = setInterval(() => {
            timeLeft--;
            $('#countdown').text(timeLeft);
            if (timeLeft <= 0) {
                clearInterval(otpTimerInterval);
                $('#timerText').hide();
                $('#resendBtn').removeClass('disabled').attr('onclick', 'resendOTPAction()');
            }
        }, 1000);
    }

    // Resend OTP Trigger Option
    function resendOTPAction() {
        let identifier = $('#forgot_email').val().trim();
        let selectedChannel = $('input[name="otp_channel"]:checked').val();
        
        swal({
            icon: "info",
            title: "Resending OTP",
            text: `A new verification code has been sent via ${selectedChannel.toUpperCase()}.`,
            timer: 2000,
            button: false
        });
        startOtpCountdown();
        
        $.ajax({
            type: "POST",
            url: "{% url 'Send_Otp_Forgot_Api' %}",
            data: { 'email': identifier, 'channel': selectedChannel, 'csrfmiddlewaretoken': '{{ csrf_token }}' }
        });
    }

    // STEP 2B (Execution): Code Validation Path
    function verifyOTP(_this) {
        let otp = "";
        $('.otp-input').each(function() { otp +=$(this).val(); });
        if(otp.length < 4) return swal({icon: "warning", title: "Incomplete Code", text: "Please enter the full otp."});

        let btnText = _this.innerHTML;
        _this.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Checking...`;
        $(_this).prop("disabled", true);

        $.ajax({
            type: "POST",
            url: "{% url 'Verify_Otp_Forgot_Api' %}", 
            data: { 'email': $('#forgot_email').val(), 'otp': otp, 'csrfmiddlewaretoken': '{{ csrf_token }}' },
            success: function(response) {
                $(_this).prop("disabled", false).html(btnText);
                if(response.valid) {
                    if (otpTimerInterval) clearInterval(otpTimerInterval);
                    goToStepAuth('step-3-details');
                } else {
                    swal({icon: "error", title: "Validation Failed", text: "OTP mismatch. Check again."});
                }
            }
        });
    }

    // STEP 3 (Execution): Account Onboarding Path
    function processProgRegistration(_this) {
        let identifier = $('#forgot_email').val();
        let password = $('#forgot_pass').val();
        let com_password = $('#forgot_com_pass').val();

        if(password != com_password) {
            return swal({icon: "warning", title: "Password mismatch.", text: "Passwords do not match"});
        }

        let btnText = _this.innerHTML;
        _this.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Provisioning...`;
        $(_this).prop("disabled", true);

        $.ajax({
            type: "POST",
            url: "{% url 'Update_Pass_Forgot_Api' %}", 
            data: { 'email': identifier, 'password': password, 'csrfmiddlewaretoken': '{{ csrf_token }}' },
            success: function(response) {
                if(response.status == '1' || response.status == 'success') {
                  swal({
                        icon: "success",
                        title: "Password Updated!",
                        text: response.msg || "Your password has been changed successfully.",
                        button: "OK"
                    }).then(() => {
                        window.location.href = "{% url 'login' %}";
                    });
                } else {
                    $(_this).prop("disabled", false).html(btnText);
                    swal({icon: "error", title: "Update Password Failed", text: response.msg || "Registration rejected."});
                }
            },
            error: function() {
                $(_this).prop("disabled", false).html(btnText);
                swal({icon: "error", title: "Server Error", text: "Onboarding tracking encountered a failure."});
            }
        });
    }
  </script>

</body>
</html>
