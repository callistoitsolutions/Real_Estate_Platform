<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Icon Class</label>
        <input type="text" name="icon_class" class="form-control" maxlength="60" required placeholder="e.g. bi bi-map">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Title</label>
        <input type="text" name="title" class="form-control" maxlength="80" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Subtitle</label>
        <input type="text" name="subtitle" class="form-control" maxlength="100" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="val_active" checked>
        <label class="form-check-label" for="val_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Value Proposition</button>
</form>
