<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Step Number</label>
        <input type="number" name="step_number" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Title</label>
        <input type="text" name="title" class="form-control" maxlength="60" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" maxlength="200" rows="3" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="step_active" checked>
        <label class="form-check-label" for="step_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Step</button>
</form>
