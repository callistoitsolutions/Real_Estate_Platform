<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Icon Class</label>
        <input type="text" name="icon_class" class="form-control" maxlength="60" required placeholder="e.g. bi bi-gem">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Title Line 1</label>
        <input type="text" name="title_line1" class="form-control" maxlength="40" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Title Line 2 (Optional)</label>
        <input type="text" name="title_line2" class="form-control" maxlength="40">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="trust_active" checked>
        <label class="form-check-label" for="trust_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Trust Highlight</button>
</form>
