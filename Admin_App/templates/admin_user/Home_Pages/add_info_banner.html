<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Icon Class</label>
        <input type="text" name="icon_class" class="form-control" maxlength="60" required placeholder="e.g. bi bi-clipboard-check">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Eyebrow (Optional)</label>
        <input type="text" name="eyebrow" class="form-control" maxlength="80">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Title</label>
        <input type="text" name="title" class="form-control" maxlength="100" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <input type="text" name="description" class="form-control" maxlength="200" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Button Text</label>
        <input type="text" name="button_text" class="form-control" maxlength="40" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Button URL</label>
        <input type="text" name="button_url" class="form-control" maxlength="200" value="#">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="banner_active" checked>
        <label class="form-check-label" for="banner_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Banner Card</button>
</form>
