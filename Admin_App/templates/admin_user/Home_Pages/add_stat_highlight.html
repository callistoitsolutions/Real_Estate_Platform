<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Icon Class</label>
        <input type="text" name="icon_class" class="form-control" maxlength="60" required placeholder="e.g. bi bi-building">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Value Text</label>
        <input type="text" name="value_text" class="form-control" maxlength="40" required placeholder="e.g. '1,200+'">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Label</label>
        <input type="text" name="label" class="form-control" maxlength="60" required placeholder="e.g. 'Property Network'">
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="stat_active" checked>
        <label class="form-check-label" for="stat_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Stat Highlight</button>
</form>
