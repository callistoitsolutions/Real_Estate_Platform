<!DOCTYPE html>
<html>
<head>
    <title>Edit Hero Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4 mb-5">
    <h2 class="mb-4">Edit Hero Section</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Eyebrow Text</label>
            <input type="text" name="eyebrow" value="{{ instance.eyebrow }}" class="form-control" placeholder="PREMIUM PROPERTIES • VERIFIED & TRUSTED">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Title — Line 1</label>
                <input type="text" name="title_line1" value="{{ instance.title_line1 }}" class="form-control" placeholder="Find Properties That">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Title — Line 2 (shown in gold)</label>
                <input type="text" name="title_line2" value="{{ instance.title_line2 }}" class="form-control" placeholder="Define Your Lifestyle">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Buy, rent, sell or invest...">{{ instance.description }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">CTA Button Text</label>
                <input type="text" name="cta_text" value="{{ instance.cta_text }}" class="form-control" placeholder="Explore Properties">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">CTA Button Link</label>
                <input type="text" name="cta_url" value="{{ instance.cta_url }}" class="form-control" placeholder="#properties">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Background Image</label><br>
            {% if instance.bg_image %}
                <img src="{{ instance.bg_image.url }}" style="height:100px; border-radius:6px;" class="mb-2"><br>
            {% endif %}
            <input type="file" name="bg_image" class="form-control" accept="image/*">
            <div class="form-text">Upload a new file only if you want to replace the current image.</div>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if instance.is_active %}checked{% endif %}>
            <label class="form-check-label" for="isActive">Set as active (shown on homepage)</label>
        </div>

        <button type="submit" class="btn btn-success">Update Hero Section</button>
        <a href="{% url 'hero_section_list' %}" class="btn btn-secondary">Back</a>
    </form>
</body>
</html>
