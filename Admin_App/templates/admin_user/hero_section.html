
{% block content %}
<div class="container py-4">
    <h3 class="mb-4">{% if instance %}Edit{% else %}Add{% endif %} Hero Section</h3>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Eyebrow Text</label>
            <input type="text" name="eyebrow" class="form-control"
                   value="{{ instance.eyebrow|default:'' }}"
                   placeholder="PREMIUM PROPERTIES  •  VERIFIED & TRUSTED">
        </div>

        <div class="mb-3">
            <label class="form-label">Title — Line 1</label>
            <input type="text" name="title_line1" class="form-control"
                   value="{{ instance.title_line1|default:'' }}"
                   placeholder="Find Properties That">
        </div>

        <div class="mb-3">
            <label class="form-label">Title — Line 2 (shown in gold)</label>
            <input type="text" name="title_line2" class="form-control"
                   value="{{ instance.title_line2|default:'' }}"
                   placeholder="Define Your Lifestyle">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4"
                      placeholder="Buy, rent, sell or invest in residential, commercial and land properties...">{{ instance.description|default:'' }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">CTA Button Text</label>
                <input type="text" name="cta_text" class="form-control"
                       value="{{ instance.cta_text|default:'' }}"
                       placeholder="Explore Properties">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">CTA Button Link</label>
                <input type="text" name="cta_url" class="form-control"
                       value="{{ instance.cta_url|default:'' }}"
                       placeholder="#properties">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Background Image</label>
            <input type="file" name="bg_image" class="form-control" accept="image/*">
            {% if instance.bg_image %}
                <div class="mt-2">
                    <img src="{{ instance.bg_image.url }}" style="height:100px;border-radius:6px;">
                    <div class="form-text">Current image — upload a new file only if you want to replace it.</div>
                </div>
            {% endif %}
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
                   {% if instance.is_active %}checked{% endif %}>
            <label class="form-check-label" for="isActive">Set as active (shown on homepage)</label>
        </div>

        <button type="submit" class="btn btn-primary">Save Hero Section</button>
        <a href="{% url 'hero_section_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
