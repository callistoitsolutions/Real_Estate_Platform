<form method="POST" action="">
    {% csrf_token %}
    <h4 class="mb-3">Add Process Step</h4>
    <div class="mb-3">
        <label class="form-label fw-bold">Step Number</label>
        <input type="number" name="step_number" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        <input type="text" name="title" class="form-control" maxlength="80" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Description</label>
        <textarea name="description" class="form-control" rows="2" maxlength="200" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" name="is_active" class="form-check-input" id="step_active" checked>
        <label class="form-check-label fw-bold" for="step_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Process Step</button>
</form>
