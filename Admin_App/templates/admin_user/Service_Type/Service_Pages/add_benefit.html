<form method="POST" action="">
    {% csrf_token %}
    <h4 class="mb-3">Add Service Benefit Card</h4>
    <div class="mb-3">
        <label class="form-label fw-bold">Icon Class</label>
        <input type="text" name="icon_class" class="form-control" placeholder="e.g. bi bi-shield-check" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        <input type="text" name="title" class="form-control" maxlength="60" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Description</label>
        <textarea name="description" class="form-control" rows="2" maxlength="200" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" name="is_active" class="form-check-input" id="ben_active" checked>
        <label class="form-check-label fw-bold" for="ben_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Benefit</button>
</form>
