<form method="POST" action="">
    {% csrf_token %}
    <h4 class="mb-3">Add Services Banner Card</h4>
    <div class="mb-3">
        <label class="form-label fw-bold">Icon Class</label>
        <input type="text" name="icon_class" class="form-control" placeholder="e.g. bi bi-clipboard-check">
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Color Variant</label>
        <select name="color_variant" class="form-select">
            <option value="blue">Gold/Blue tint</option>
            <option value="indigo">Grey/Indigo tint</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Eyebrow</label>
        <input type="text" name="eyebrow" class="form-control" maxlength="100">
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        <input type="text" name="title" class="form-control" maxlength="100" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Description</label>
        <textarea name="description" class="form-control" rows="2" maxlength="200" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Button Text</label>
        <input type="text" name="button_text" class="form-control" maxlength="40" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Button URL</label>
        <input type="text" name="button_url" class="form-control" value="#" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Order</label>
        <input type="number" name="order" class="form-control" value="0">
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" name="is_active" class="form-check-input" id="sbc_active" checked>
        <label class="form-check-label fw-bold" for="sbc_active">Is Active</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Banner Card</button>
</form>
